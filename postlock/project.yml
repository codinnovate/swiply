name: Postlock
options:
  bundleIdPrefix: com.swiply
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: 9WHCDKVKJQ
    REVENUECAT_API_KEY: "appl_TaphXKAhCAsvWtNloslQxezDOrk"
  configs:
    Debug:
      API_BASE_URL: "http://localhost:3000"
    Release:
      API_BASE_URL: "https://postlock.up.railway.app"
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.0.0
targets:
  Postlock:
    type: application
    platform: iOS
    sources:
      - path: Postlock
    resources:
      - path: Postlock/Resources
    info:
      path: Postlock/Resources/Info.plist
      properties:
        CFBundleDisplayName: POSTLOCK
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        API_BASE_URL: "$(API_BASE_URL)"
        REVENUECAT_API_KEY: "$(REVENUECAT_API_KEY)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiply.postlock
        CODE_SIGN_ENTITLEMENTS: Postlock/Postlock.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - PostlockTests
        - PostlockUITests
    dependencies:
      - target: PostlockDeviceActivityMonitor
        embed: true
      - package: RevenueCat
  PostlockDeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: PostlockDeviceActivityMonitor
    info:
      path: PostlockDeviceActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: POSTLOCK Deadline Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PostlockDeviceActivityMonitor"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiply.postlock.device-activity-monitor
        CODE_SIGN_ENTITLEMENTS: PostlockDeviceActivityMonitor/PostlockDeviceActivityMonitor.entitlements
        GENERATE_INFOPLIST_FILE: NO
  PostlockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PostlockTests
    dependencies:
      - target: Postlock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiply.postlock.tests
        GENERATE_INFOPLIST_FILE: YES
  PostlockUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PostlockUITests
    dependencies:
      - target: Postlock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiply.postlock.uitests
        GENERATE_INFOPLIST_FILE: YES
